# Render blueprint: one web service (API + built frontend in a single image) and a free Postgres.
# Deploy with https://render.com/deploy?repo=https://github.com/Tarunmeena656/JobAgent
services:
  - type: web
    name: jobagent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobagent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: console
      - key: SEED_DEMO
        value: "1"
      - key: STORAGE_DIR
        value: /data/storage

databases:
  - name: jobagent-db
    plan: free
    databaseName: jobagent
    user: jobagent
